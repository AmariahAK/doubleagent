# Weekly update pull requests for the analyzer's Python dependencies, the
# documentation site's (requirements-docs.txt) and the actions the workflows
# use. Security alerts are checked separately by .githooks/pre-commit.
version: 2
updates:
  - package-ecosystem: pip
    directory: /analyzer
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
