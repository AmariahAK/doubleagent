# Builds the documentation site from the Markdown documents where they are
# (see mkdocs/mkdocs.yml) with MkDocs and the Material theme, and publishes
# it to GitHub Pages at https://seanthegeek.net/doubleagent/.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "mkdocs/**"
      - requirements-docs.txt
      # mkdocs/hooks.py takes the heading anchors from the link check.
      - tools/check_doc_links.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - uses: actions/configure-pages@v6
      # MkDocs refuses a site directory inside the documents, which are the
      # whole checkout, so the site is built in the runner's temp directory.
      - name: Build
        run: mkdocs build --strict -f mkdocs/mkdocs.yml -d "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
