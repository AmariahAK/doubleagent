name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job only checks out the repository and downloads public release
# binaries, so the token needs no more than read access to the contents.
permissions:
  contents: read

# Linter versions for the lint job. AGENTS.md ("Quality gates") and
# .githooks/pre-commit list the same versions; change all three together.
env:
  RUFF_VERSION: "0.16.10"
  PYRIGHT_VERSION: "1.1.414"
  MARKDOWNLINT_CLI2_VERSION: "0.23.3"
  SHELLCHECK_VERSION: "0.11.0"
  SHFMT_VERSION: "3.14.1"
  CHECKBASHISMS_TAG: "v2.26.13"
  PSSA_VERSION: "1.25.0"

jobs:
  # A change that touches only Markdown and the markdownlint configuration
  # needs markdownlint and the document link check, nothing else: the
  # released scripts and package are unchanged (AGENTS.md, "Validation and
  # testing"). This job classifies the push or pull request, and every
  # other job except the Markdown steps of lint is skipped when it is
  # documentation only. A push whose "before" commit is unknown (a new
  # branch, a force push) counts as a code change.
  changes:
    name: Classify the change
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify
        id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          docs=false
          changed=""
          if [ -n "$BASE" ] && ! printf '%s' "$BASE" | grep -q '^0*$' && git cat-file -e "$BASE" 2>/dev/null; then
            changed=$(git diff --name-only "$(git merge-base "$BASE" "$GITHUB_SHA")" "$GITHUB_SHA")
            other=$(printf '%s\n' "$changed" | grep -vE '\.md$|^\.markdownlint-cli2\.jsonc$' || true)
            if [ -n "$changed" ] && [ -z "$other" ]; then
              docs=true
            fi
          fi
          echo "docs-only=$docs" >> "$GITHUB_OUTPUT"
          printf 'docs-only=%s\nchanged files:\n%s\n' "$docs" "$changed"

  catalog-sync:
    name: Catalog tables in sync (sh, PowerShell, analyzer copy)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Drift test
        run: collectors/tests/catalog-sync.sh
      - name: Regenerated copy matches the committed one
        run: |
          collectors/collect-agent-artifacts.sh --list > /tmp/catalog.txt
          if ! cmp -s /tmp/catalog.txt analyzer/doubleagent/catalog.txt; then
            echo "analyzer/doubleagent/catalog.txt is stale. Run:"
            echo "  collectors/collect-agent-artifacts.sh --list > analyzer/doubleagent/catalog.txt"
            diff /tmp/catalog.txt analyzer/doubleagent/catalog.txt || true
            exit 1
          fi

  # One job per shell so the smoke runs, several minutes each, run in
  # parallel. `shell` is the argument to smoke.sh; `wrapper` is the body of
  # a wrapper script for shells that need flags or a multi-call binary.
  sh-collector:
    name: sh collector (smoke under ${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sh
            shell: sh
          - name: dash
            shell: dash
            package: dash
          - name: bash
            shell: bash
          - name: busybox ash
            shell: /tmp/ash
            package: busybox-static
            wrapper: exec busybox ash "$@"
          - name: zsh --emulate sh
            shell: /tmp/zsh-sh
            package: zsh
            wrapper: exec zsh --emulate sh "$@"
          - name: posh
            shell: posh
            package: posh
    steps:
      - uses: actions/checkout@v7
      - name: Install the shell
        if: matrix.package
        run: sudo apt-get update -q && sudo apt-get install -y -q ${{ matrix.package }}
      - name: Write the wrapper
        if: matrix.wrapper
        env:
          WRAPPER: ${{ matrix.wrapper }}
          TARGET: ${{ matrix.shell }}
        run: printf '#!/bin/sh\n%s\n' "$WRAPPER" > "$TARGET" && chmod +x "$TARGET"
      - name: smoke
        run: collectors/tests/smoke.sh ${{ matrix.shell }}

  sh-shellcheck:
    name: sh collector (shellcheck)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - name: shellcheck
        run: shellcheck -s sh -S warning collectors/collect-agent-artifacts.sh

  powershell-7:
    name: PowerShell collector (smoke under PowerShell 7 on Linux)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    steps:
      - uses: actions/checkout@v7
      - name: smoke
        shell: pwsh
        run: ./collectors/tests/smoke.ps1

  windows-powershell-51:
    name: PowerShell collector (smoke under Windows PowerShell 5.1)
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    steps:
      - uses: actions/checkout@v7
      - name: smoke
        shell: powershell
        run: .\collectors\tests\smoke.ps1

  analyzer:
    name: Analyzer tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install analyzer dependencies
        run: pip install -r analyzer/requirements.txt
      - name: unittest
        run: analyzer/tests/run.sh

  lint:
    name: Lint (ruff, pyright, markdownlint, sh linters, PSScriptAnalyzer)
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: needs.changes.outputs.docs-only != 'true'
        with:
          python-version: "3.10"
      - name: Install Python linters and analyzer dependencies
        if: needs.changes.outputs.docs-only != 'true'
        run: pip install "ruff==$RUFF_VERSION" "pyright==$PYRIGHT_VERSION" -r analyzer/requirements.txt
      - name: ruff check
        if: needs.changes.outputs.docs-only != 'true'
        run: ruff check .
      - name: ruff format --check
        if: needs.changes.outputs.docs-only != 'true'
        run: ruff format --check .
      - name: pyright (Python 3.10)
        if: needs.changes.outputs.docs-only != 'true'
        run: pyright
      - name: markdownlint
        run: npx -y "markdownlint-cli2@$MARKDOWNLINT_CLI2_VERSION" "**/*.md"
      - name: document links
        run: python3 tools/check_doc_links.py
      - name: Install sh linters
        if: needs.changes.outputs.docs-only != 'true'
        run: |
          mkdir -p "$HOME/bin"
          curl -sfL "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz" | tar xJ -C /tmp
          install /tmp/shellcheck-v$SHELLCHECK_VERSION/shellcheck "$HOME/bin/shellcheck"
          curl -sfL -o "$HOME/bin/shfmt" "https://github.com/mvdan/sh/releases/download/v$SHFMT_VERSION/shfmt_v${SHFMT_VERSION}_linux_amd64"
          curl -sfL -o "$HOME/bin/checkbashisms" "https://salsa.debian.org/debian/devscripts/-/raw/$CHECKBASHISMS_TAG/scripts/checkbashisms.pl"
          printf '%s  %s\n' \
            4da528ddb3a4d1b7b24a59d4e16eb2f5fd960f4bd9a3708a15baddbdf1d5a55b "$HOME/bin/shellcheck" \
            76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf "$HOME/bin/shfmt" \
            7ffec5f4f3282d7551b7f1dd103d84ea6034bb1f177efdce2cebc60bfd72c088 "$HOME/bin/checkbashisms" | sha256sum -c -
          chmod +x "$HOME/bin/shfmt" "$HOME/bin/checkbashisms"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: shfmt POSIX parse (no reformatting)
        if: needs.changes.outputs.docs-only != 'true'
        run: shfmt -ln posix $(shfmt -f .) > /dev/null
      - name: shellcheck (all sh files, .shellcheckrc)
        if: needs.changes.outputs.docs-only != 'true'
        run: shellcheck -s sh $(shfmt -f .)
      - name: checkbashisms
        if: needs.changes.outputs.docs-only != 'true'
        run: checkbashisms -p $(shfmt -f .)
      - name: Install PSScriptAnalyzer
        if: needs.changes.outputs.docs-only != 'true'
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -RequiredVersion $env:PSSA_VERSION -Force
      - name: PSScriptAnalyzer
        if: needs.changes.outputs.docs-only != 'true'
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSA_VERSION
          $r = @('collectors/Collect-AgentArtifacts.ps1', 'collectors/tests/smoke.ps1') | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Settings collectors/PSScriptAnalyzerSettings.psd1 }
          $r | Format-Table -AutoSize
          exit @($r).Count
