# The documentation site at https://seanthegeek.net/doubleagent/, built with
# MkDocs and the Material theme from the Markdown documents where they are in
# the repository, by .github/workflows/pages.yml:
#
#   pip install -r requirements-docs.txt
#   mkdocs build --strict -f mkdocs/mkdocs.yml -d <directory outside the checkout>
#
# The documents are the whole repository, so docs_dir is the repository root.
# MkDocs refuses a docs_dir that is the parent of the config file, so this
# file sits in its own directory, and it refuses a site_dir inside docs_dir,
# so there is no site_dir here: the build is always given -d with a
# directory outside the checkout. A new document page is added to `nav:`
# below; --strict fails the build on a document missing from it.
site_name: DoubleAgent
site_description: >-
  Forensic analysis of AI agent use on a system, for incident responders.
site_url: https://seanthegeek.net/doubleagent/
repo_url: https://github.com/seanthegeek/doubleagent
repo_name: seanthegeek/doubleagent
edit_uri: ""
docs_dir: ..
# foo.md becomes foo.html, the URLs the site has always had (and that
# analyzer/pyproject.toml links to); hooks.py keeps README.md as README.html.
use_directory_urls: false

# Only the Markdown documents are pages; nothing else in the repository is
# published. Every file is excluded, the Markdown files are taken back, and
# then the ones that are not documents are excluded again. The theme's own
# files (assets/) are matched by these patterns too, so they are taken back.
# The patterns are gitignore patterns; a re-excluded path names the files
# (dir/**), not the directory, since a file-level `!*.md` outranks a
# directory-level match.
exclude_docs: |
  *
  !*.md
  !/assets/**
  **/.*/**
  /CLAUDE.md
  /mkdocs/**
  /analyzer/doubleagent/**
  /analyzer/tests/**
  /analyzer/tools/**
  /analyzer/build/**
  /analyzer/dist/**
  /collectors/tests/**
  /tools/**
  /lab/out/**
  **/node_modules/**

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    # A link to a page or file that does not exist fails the build. A link
    # to a directory, or to a file that is not a page (CLAUDE.md, LICENSE,
    # the scripts), is pointed at GitHub by hooks.py.
    not_found: warn
    absolute_links: warn
    unrecognized_links: info
    anchors: warn

hooks:
  - hooks.py

theme:
  name: material
  features:
    - navigation.indexes
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

# Plain GitHub Markdown: no smart quotes, no admonitions. Heading ids are
# GitHub's (lower case, digits kept, hyphens not collapsed); hooks.py gives
# repeated headings GitHub's -1, -2 suffixes.
markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

